<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LectureLens Pro</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #020617;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #22c55e;
      margin-bottom: 16px;
    }

    .toolbar {
      margin-bottom: 16px;
    }

    select, button {
      padding: 10px 14px;
      margin-right: 8px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    select {
      background: #111827;
      color: white;
      border: 1px solid #334155;
    }

    button {
      background: #16a34a;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      min-height: 70px;
      white-space: pre-wrap;
    }

    .label {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #f8fafc;
    }

    .muted {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>LectureLens Pro</h1>

  <div class="toolbar">
    <select id="courseSelect">
      <option value="Digital Marketing">Digital Marketing</option>
      <option value="Economics">Economics</option>
      <option value="Business English">Business English</option>
      <option value="Finance">Finance</option>
    </select>

    <button id="startBtn">Start Lecture</button>
    <button id="exportBtn">Export Word</button>
  </div>

  <div class="box">
    <div class="label">Original</div>
    <div id="originalBox" class="muted">Waiting...</div>
  </div>

  <div class="box">
    <div class="label">Translation</div>
    <div id="translatedBox"></div>
  </div>

  <div class="box">
    <div class="label">Summary</div>
    <div id="summaryBox"></div>
  </div>

  <div class="box">
    <div class="label">Key Terms</div>
    <div id="termsBox"></div>
  </div>

  <div class="box">
    <div class="label">Exam Points</div>
    <div id="examBox"></div>
  </div>

  <div class="box">
    <div class="label">Lecture Notes</div>
    <div id="notesBox"></div>
  </div>

  <script>
    const API_BASE = "https://lecturelens-api.onrender.com";

    const startBtn = document.getElementById("startBtn");
    const exportBtn = document.getElementById("exportBtn");
    const courseSelect = document.getElementById("courseSelect");

    const originalBox = document.getElementById("originalBox");
    const translatedBox = document.getElementById("translatedBox");
    const summaryBox = document.getElementById("summaryBox");
    const termsBox = document.getElementById("termsBox");
    const examBox = document.getElementById("examBox");
    const notesBox = document.getElementById("notesBox");

    let mediaRecorder = null;
    let audioChunks = [];
    let recording = false;

    function resetUI() {
      originalBox.innerText = "Waiting...";
      translatedBox.innerText = "";
      summaryBox.innerText = "";
      termsBox.innerText = "";
      examBox.innerText = "";
      notesBox.innerText = "";
    }

    async function transcribeAudio(blob) {
      const formData = new FormData();
      formData.append("audio", blob, "lecture.webm");

      const res = await fetch(`${API_BASE}/transcribe`, {
        method: "POST",
        body: formData
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Transcribe failed");
      }

      return data.text || "";
    }

    async function analyzeText(text) {
      const res = await fetch(`${API_BASE}/analyze`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ text })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || "Analyze failed");
      }

      return data;
    }

    async function processAudio(blob) {
      try {
        originalBox.innerText = "Transcribing...";

        const text = await transcribeAudio(blob);

        if (!text.trim()) {
          originalBox.innerText = "No speech detected.";
          return;
        }

        originalBox.innerText = text;
        translatedBox.innerText = "Analyzing...";
        summaryBox.innerText = "Analyzing...";
        termsBox.innerText = "Analyzing...";
        examBox.innerText = "Analyzing...";
        notesBox.innerText = "Analyzing...";

        const result = await analyzeText(text);

        translatedBox.innerText = result.translation || "";
        summaryBox.innerText = result.summary || "";
        termsBox.innerText = Array.isArray(result.terms)
          ? result.terms.join(" / ")
          : "";
        examBox.innerText = Array.isArray(result.exam_points)
          ? result.exam_points.join("\n")
          : "";

        notesBox.innerText =
          `Course: ${courseSelect.value}\n\n` +
          `Original:\n${text}\n\n` +
          `Translation:\n${result.translation || ""}\n\n` +
          `Summary:\n${result.summary || ""}\n\n` +
          `Key Terms:\n${
            Array.isArray(result.terms) ? result.terms.join(", ") : ""
          }\n\n` +
          `Exam Points:\n${
            Array.isArray(result.exam_points) ? result.exam_points.join("\n") : ""
          }`;
      } catch (err) {
        console.error(err);
        originalBox.innerText = `Process error: ${err.message}`;
        translatedBox.innerText = "";
        summaryBox.innerText = "";
        termsBox.innerText = "";
        examBox.innerText = "";
        notesBox.innerText = "";
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(audioChunks, { type: "audio/webm" });
          await processAudio(blob);

          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        recording = true;
        startBtn.innerText = "Stop Lecture";
        originalBox.innerText = "Recording...";
      } catch (err) {
        console.error(err);
        originalBox.innerText = `Mic error: ${err.message}`;
      }
    }

    function stopRecording() {
      if (mediaRecorder && recording) {
        mediaRecorder.stop();
      }
      recording = false;
      startBtn.innerText = "Start Lecture";
    }

    startBtn.addEventListener("click", async () => {
      if (!recording) {
        resetUI();
        await startRecording();
      } else {
        stopRecording();
      }
    });

    exportBtn.addEventListener("click", () => {
      const content =
`LectureLens Pro

Course:
${courseSelect.value}

Original:
${originalBox.innerText}

Translation:
${translatedBox.innerText}

Summary:
${summaryBox.innerText}

Key Terms:
${termsBox.innerText}

Exam Points:
${examBox.innerText}

Lecture Notes:
${notesBox.innerText}
`;

      const blob = new Blob([content], {
        type: "application/msword"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "lecture-notes.doc";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
